<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TUI Call Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'18'%20fill%3D'%23e8890c'%2F%3E%3Cpath%20d%3D'M13%2033%2051%2015%2041%2050%2031%2039%2024%2045%2025%2034z'%20fill%3D'%23fff'%2F%3E%3C%2Fsvg%3E">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('tui-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1c2a44;--mut:#66758f;--line:#e4eaf3;--ac:#2f6fed;--acs:#e7efff;--warn:#935300;--warns:#fff1cc;--bad:#b42318;--bads:#fde8e6;--ok:#17803d;--oks:#e0f5e7;--r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 8px 20px -12px rgba(16,24,40,.2);--sea:#e8f0f6;--land:#cfd8e3;--landl:#b9c5d4;--ease:cubic-bezier(.2,.8,.2,1)}
[data-theme=dark]{--bg:#0b1220;--card:#131c2e;--ink:#e8ecf3;--mut:#93a0b4;--line:#263041;--ac:#6ea0ff;--acs:#1b2a4d;--warn:#f0c866;--warns:#3a2f12;--bad:#ff8a80;--bads:#3a1d1a;--ok:#5fd68a;--oks:#14301f;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 22px -14px rgba(0,0,0,.8);--sea:#101a27;--land:#26364b;--landl:#33465f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:84px 1fr;height:100vh;height:100dvh}
.rail{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:12px 8px}
.logo{width:48px;height:40px;margin:2px auto 10px;border-radius:11px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.04em;font-size:14px}
.rail button{position:relative;border:0;background:transparent;border-radius:12px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut);transition:background .2s,color .2s}
.rail button:hover{background:var(--bg)}
.rail button.on{background:var(--acs);color:var(--ac)}
.bd{position:absolute;top:4px;right:8px;background:var(--ac);color:#fff;border-radius:999px;font-size:10px;padding:0 6px;line-height:16px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:30}
.sbox{flex:1;position:relative;max-width:700px;min-width:0}
.sbox>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.sbox input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px 11px 40px;font-size:16px;outline:0;transition:border-color .2s,box-shadow .2s}
.sbox input[type=text]:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.res{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -20px rgba(0,0,0,.45);max-height:72vh;overflow:auto;padding:6px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s,transform .25s var(--ease),visibility 0s .25s}
.res.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.rr{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer}
.rr:hover,.rr.sel{background:var(--acs)}
.rr .k{flex:none;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);background:var(--acs);border-radius:6px;padding:2px 7px;margin-top:3px;min-width:64px;text-align:center}
.rr .m{flex:1;min-width:0}
.rr b{display:block;font-size:14.5px}
.rr small{display:block;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rr .cp2{flex:none;border:1px solid var(--line);background:var(--card);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--ac)}
.rr .cp2:hover{background:var(--acs)}
.rc{padding:10px 8px 6px}
.rc h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;transition:border-color .2s,background .2s,color .2s}
.pill:hover{border-color:var(--ac);color:var(--ac)}
.pill.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--mut);flex:none;transition:all .2s;position:relative}
.ib:hover,.ib.on{color:var(--ac);border-color:var(--ac)}
.callb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ac);background:var(--acs);color:var(--ac);border-radius:10px;height:40px;padding:0 13px;font-weight:700;font-size:14px;flex:none;font-variant-numeric:tabular-nums;transition:all .2s}
.callb.run{background:var(--ac);color:#fff}
.callb .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.tchip{display:none;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;flex:none}
.tchip.on{display:inline-flex}
.tchip i{width:9px;height:9px;border-radius:50%;background:var(--tc,var(--ac))}
.dchip{display:none;align-items:center;gap:6px;border:1px solid var(--ac);background:var(--acs);color:var(--ac);border-radius:999px;padding:6px 8px 6px 12px;font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.dchip.on{display:inline-flex}
.dchip i{font-style:normal;opacity:.7;padding:0 4px;cursor:pointer}
/* dock */
#dock{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease);background:var(--card);border-bottom:1px solid transparent;position:relative;z-index:20}
#dock.on{grid-template-rows:1fr;border-bottom-color:var(--line)}
#dock>div{overflow:hidden;min-height:0}
.dk{display:flex;gap:8px;align-items:center;padding:8px 14px;flex-wrap:wrap}
.dk .lb{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;gap:6px;align-items:center;border:0;background:transparent;padding:4px 6px;border-radius:8px}
.dk .lb:hover{background:var(--bg)}
.dk .lb .ic{width:16px;height:16px;transition:transform .25s}
#dock.col .dk .lb .ic.ch{transform:rotate(-90deg)}
.ri{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:5px 6px 5px 12px;max-width:100%;animation:pop .3s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.ri b{font-weight:600;font-size:13.5px;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .cd{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.ri button{border:0;background:var(--card);border:1px solid var(--line);border-radius:8px;height:28px;padding:0 9px;font-size:12.5px;font-weight:700;color:var(--ink)}
.ri button:hover{border-color:var(--ac);color:var(--ac)}
.ri .ok{width:28px;padding:0;display:grid;place-items:center;color:var(--ok)}
.ri.due{background:var(--warns);border-color:var(--warn);animation:pulse 1.2s infinite}
.ri.due .cd{color:var(--warn);font-weight:800}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(232,137,12,.25)}}
#dock.col .ri:not(.due){display:none}
.sync{margin-left:auto;font-size:11.5px;color:var(--mut);display:flex;gap:6px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.sync.on i{background:var(--ok)}
/* reminder pop */
#rpop{position:absolute;right:14px;top:calc(100% + 6px);width:min(380px,calc(100vw - 28px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -20px rgba(0,0,0,.5);padding:14px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s,transform .25s var(--ease),visibility 0s .25s;z-index:40}
#rpop.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.stage{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow:auto;padding:18px 20px 110px;opacity:0;visibility:hidden;transform:translateX(26px);pointer-events:none;transition:opacity .26s ease,transform .34s var(--ease),visibility 0s .34s}
.view.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition-delay:0s}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:24px 0 10px}
.rise{animation:rise .42s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));align-items:start}
.tile{display:flex;align-items:flex-start;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);transition:transform .25s var(--ease),border-color .2s}
.tile:hover{border-color:var(--ac);transform:translateY(-2px)}
.tile.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.tile .d{width:38px;height:38px;border-radius:11px;background:hsl(var(--h) 70% 92%);color:hsl(var(--h) 70% 30%);display:grid;place-items:center;flex:none;font-weight:800}
[data-theme=dark] .tile .d{background:hsl(var(--h) 40% 20%);color:hsl(var(--h) 80% 75%)}
.tile b{display:block;font-size:15px}
.tile small{display:block;color:var(--mut);font-size:12.5px;font-weight:500;line-height:1.35;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;transition:all .2s}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.p:hover{filter:brightness(1.07);color:#fff}
.btn .ic{width:17px;height:17px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;transition:all .18s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip.na{color:var(--mut);font-weight:500}
.chip.na.on{background:var(--mut);border-color:var(--mut);color:#fff}
.scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.scroll .pill{flex:none}
/* now panel */
.now{border-color:var(--ac);padding:14px;margin-bottom:6px}
.now .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.now .hd .lb{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ac);margin-right:4px}
.now .pill.auto::after{content:'auto';font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.75;margin-left:2px}
.nl{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
/* say box */
.say{display:flex;gap:10px;align-items:flex-start;background:var(--acs);border-radius:12px;padding:12px 10px 12px 14px;cursor:pointer;position:relative;border-left:4px solid var(--ac);transition:transform .15s,filter .2s}
.say:hover{filter:brightness(.97)}
.say:active{transform:scale(.99)}
.say.gen{border-left-color:var(--line);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line)}
.say.gen:hover{background:var(--bg)}
.say .st{flex:1;min-width:0}
.say p{margin:0;font-size:15px}
.say .tip{display:block;margin-top:4px;font-size:12.5px;color:var(--mut)}
.say .cp{flex:none;border:0;background:var(--card);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--ac)}
.tg{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.ph{background:var(--warns);color:var(--warn);border-radius:4px;padding:0 4px;font-weight:600}
.tip{font-size:12.5px;color:var(--mut)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--ac)}100%{box-shadow:0 0 0 3px transparent}}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--mut);font-weight:600;font-size:13.5px;padding:4px 8px 4px 2px;margin-bottom:6px;border-radius:8px}
.back:hover{color:var(--ac)}
.back .ic{width:17px;height:17px}
.spot{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin:12px 0 4px}
.spot div{border-radius:12px;padding:10px 12px;font-size:14px}
.spot .a{background:var(--bg);border:1px solid var(--line)}
.spot .b{background:var(--bads);color:var(--bad)}
.spot small{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:1px}
.sh{display:flex;gap:8px;align-items:center;margin:20px 0 8px}
.sh h3{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ac)}
.sh:after{content:'';flex:1;height:1px;background:var(--line)}
.fld{margin-bottom:14px}
.fl{font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:6px}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.row>.btn,.row>.ib{flex:none;min-width:0}
.memo{white-space:pre-wrap;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:200px;margin:0}
.stick{position:sticky;top:0}
.nbar{position:fixed;left:84px;right:0;bottom:0;display:flex;gap:10px;padding:10px 16px;background:var(--card);border-top:1px solid var(--line);z-index:15;transform:translateY(110%);transition:transform .3s var(--ease)}
.nbar.on{transform:none}
.nbar .btn{flex:1;justify-content:center}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.badge{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;background:var(--acs);color:var(--ac)}
.badge.w{background:var(--warns);color:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--mut);transition:all .2s}
.seg button.on{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
/* map */
.map{background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.map svg{width:100%;height:auto;display:block}
.map .land{fill:var(--land);stroke:var(--landl);stroke-width:.5;stroke-linejoin:round}
.map .grat{stroke:var(--landl);stroke-width:.4;opacity:.5;fill:none}
.map .pin{fill:var(--mut);opacity:.7;transition:fill .2s}
.map .dotg{cursor:pointer}
.map .dotg:hover .pin{fill:var(--ac);opacity:1}
.map .hit{fill:transparent}
.map .pin.o{fill:var(--ac);opacity:1}
.map .pin.t{fill:#e8890c;opacity:1}
.map .route{fill:none;stroke:#e8890c;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.map .ring{fill:none;stroke:#e8890c;transform-box:fill-box;transform-origin:center;animation:ring 1.8s infinite}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.2);opacity:0}}
.map .lbl{fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.mapctl{position:absolute;left:10px;top:10px}
.diff{border-radius:3px;padding:0 2px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ease);z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}
#nudge{position:fixed;right:18px;bottom:18px;width:min(400px,calc(100vw - 28px));z-index:60}
.nd{background:var(--card);border:1px solid var(--ac);border-left:5px solid var(--ac);border-radius:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5);padding:12px 12px 12px 14px;animation:ndin .45s var(--ease) both}
.nd.out{animation:ndout .35s ease both}
@keyframes ndin{from{opacity:0;transform:translateX(30px)}}
@keyframes ndout{to{opacity:0;transform:translateX(30px)}}
.nd .h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.nd .h b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);flex:1}
.nd .h button{border:0;background:transparent;color:var(--mut);width:26px;height:26px;border-radius:8px}
.nd .h button:hover{background:var(--bg)}
.nd p{margin:0;font-size:14.5px;font-weight:600}
.nd .say{margin-top:8px;padding:9px 8px 9px 12px}
.nd .say p{font-weight:500;font-size:14px}
.nd .bar{height:3px;background:var(--acs);border-radius:3px;margin-top:10px;overflow:hidden}
.nd .bar i{display:block;height:100%;background:var(--ac);animation:shrink var(--d,10s) linear forwards;transform-origin:left}
@keyframes shrink{to{transform:scaleX(0)}}
.hint{font-size:12px;color:var(--mut);margin-top:18px}
.hint kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:600 11.5px ui-monospace,Menlo,monospace;background:var(--card)}
.uk{display:grid;gap:8px;grid-template-columns:1fr 1fr;align-items:stretch}
.uk .a,.uk .b{border-radius:10px;padding:9px 12px;font-size:14px}
.uk .a{background:var(--warns);color:var(--warn);font-weight:600}
.uk .b{background:var(--bg);border:1px solid var(--line)}
.uk small{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.swapg{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.swapg .a{background:var(--bads);border-radius:10px;padding:10px 12px;font-size:14px}
.swapg small{display:block;font-weight:800;font-size:10px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px;color:var(--mut)}
body.focus .rail{display:none}
body.focus .app{grid-template-columns:1fr}
body.focus .nbar{left:0}
body.focus .say p{font-size:18px}
body.focus .view{padding-top:22px}
@media(max-width:760px){
 .app{grid-template-columns:1fr;grid-template-rows:1fr auto}

const ASP=2.4,LP=v=>[(v[0]+180)/360*1000,(90-v[1])/180*500];
let vb=[0,45,1000,1000/ASP],vbA=0;
const WORLDVB=[0,55,1000,1000/ASP];
function fitVB(pts,minW){const xy=pts.map(p=>LP([p.lon,p.lat])),xs=xy.map(p=>p[0]),ys=xy.map(p=>p[1]);
 const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
 let w=Math.max((Math.max(...xs)-Math.min(...xs))*1.6,minW||140),h=w/ASP;const need=(Math.max(...ys)-Math.min(...ys))*1.7;if(need>h){h=need;w=h*ASP}
 w=Math.min(w,1000);h=w/ASP;let x=cx-w/2,y=cy-h/2;x=Math.max(0,Math.min(1000-w,x));y=Math.max(0,Math.min(500-h,y));return[x,y,w,h]}
const REGIONS={world:WORLDVB,europe:fitVB([{lon:-12,lat:36},{lon:42,lat:58}],150),mideast:fitVB([{lon:22,lat:10},{lon:70,lat:40}],150)};
function applyVB(){const svg=$('#msvg');if(!svg)return;svg.setAttribute('viewBox',vb.map(v=>+v.toFixed(2)).join(' '));const k=vb[2]/1000;
 $$('[data-r]',svg).forEach(c=>c.setAttribute('r',(+c.dataset.r*k).toFixed(2)));
 $$('[data-sw]',svg).forEach(c=>c.setAttribute('stroke-width',(+c.dataset.sw*k).toFixed(2)));
 $$('[data-fs]',svg).forEach(c=>{c.setAttribute('font-size',(+c.dataset.fs*k).toFixed(2));c.setAttribute('stroke-width',(3*k).toFixed(2))})}
function animVB(to){cancelAnimationFrame(vbA);const from=vb.slice(),t0=performance.now();
 const step=t=>{const k=Math.min(1,(t-t0)/600),e=1-Math.pow(1-k,3);vb=from.map((v,i)=>v+(to[i]-v)*e);applyVB();if(k<1)vbA=requestAnimationFrame(step)};vbA=requestAnimationFrame(step)}
function autoVB(){const o=P(S.origin),t=P(S.dest);return o&&t&&o.id!==t.id?fitVB([o,t],150):t?fitVB([o||P('lhr'),t],150):WORLDVB}
function mapHTML(){

 let grat='';for(let lo=-150;lo<=150;lo+=30){const x=(lo+180)/360*1000;grat+=`M${x} 0V500`}for(let la=-60;la<=60;la+=30){const y=(90-la)/180*500;grat+=`M0 ${y}H1000`}
 const dots=DESTS.map(d=>{const[x,y]=LP([d.lon,d.lat]),isT=t&&t.id===d.id,isO=o&&o.id===d.id;return `<g class="dotg" data-d="${d.id}"><title>${esc(d.n)}</title><circle class="hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" data-r="11"/><circle class="pin${isT?' t':''}${isO?' o':''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" data-r="${isT||isO?6:3.6}"/></g>`}).join('');
 let route='',extra='',lab='';
 if(o&&t&&o.id!==t.id){const[x1,y1]=LP([o.lon,o.lat]),[x2,y2]=LP([t.lon,t.lat]),mx=(x1+x2)/2,my=(y1+y2)/2-Math.hypot(x2-x1,y2-y1)*.2;
  route=`<path class="route" pathLength="1" data-sw="2.2" d="M${x1.toFixed(1)} ${y1.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
  extra=`<circle class="ring" cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" data-r="9" data-sw="1.6"/>`}
 if(o){const[x,y]=LP([o.lon,o.lat]);extra+=`<circle class="pin o" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" data-r="6"/>`;lab+=`<text class="lbl" x="${(x+8).toFixed(1)}" y="${(y+14).toFixed(1)}" data-fs="12">${esc(o.n)}</text>`}
 if(t){const[x,y]=LP([t.lon,t.lat]);lab+=`<text class="lbl" x="${(x+8).toFixed(1)}" y="${(y-8).toFixed(1)}" data-fs="12">${esc(t.n)}</text>`}
 return `<svg id="msvg" viewBox="${vb.join(' ')}" role="img" aria-label="Flight map"><path class="grat" data-sw="1" d="${grat}"/><path class="land" data-sw="1" d="${LAND}"/>${route}${dots}${extra}${lab}</svg>`}

function closeRes(){$('#res').classList.remove('on')}
function renderRes(){const box=$('#res'),q=$('#q').value.trim();
 if(!q){const rc=S.recent||[];box.innerHTML=`<div class="rc">${rc.length?`<h4>Recent</h4><div class="chips" style="margin-bottom:12px">${rc.map(r=>`<button class="pill" data-rq="${esc(r)}">${esc(r)}</button>`).join('')}</div>`:''}<h4>Try</h4><div class="chips">${['angry','cheaper','baggage','cancel fee','delay','insurance','Dubai','في عميل بيصرخ'].map(r=>`<button class="pill" data-rq="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>`;SR=[];box.classList.add('on');return}
 SR=search(q);
 box.innerHTML=SR.length?SR.map((e,i)=>{let sub=e.sub;
  if(e.kind==='Flight'){const d=P(e.target.id),r=estH(P(S.origin)||P('lhr'),d);sub=d.cc+' - about '+fmtH(r.h)+' from '+(P(S.origin)||P('lhr')).n}
  const one=e.target.k==='mom'?`<i>${esc(e.sub)}</i>${esc(e.text)}`:esc(e.text&&e.text!==e.title?e.text:sub);
  return `<div class="rr${i===SEL?' sel':''}" data-i="${i}" role="button" tabindex="-1"><span class="k">${esc(e.kind)}</span><span class="m"><b>${esc(e.title)}</b><small>${one}</small></span>${e.text?`<button class="cp2" data-sp="${i}" title="Listen">${ic('spk')}</button><button class="cp2" data-cp="${i}" title="Copy line">${ic('copy')}</button>`:''}</div>`}).join(''):'<p class="tip" style="padding:12px">No match. Try one word: angry, price, cancel, baggage, Dubai.</p>';
 box.classList.add('on')}
function openRes(e){if(!e)return;const q=$('#q').value.trim();if(q){S.recent=[q].concat((S.recent||[]).filter(x=>x!==q)).slice(0,6);saveS()}
 closeRes();$('#q').value='';$('#q').blur();const t=e.target;
 if(t.k==='type'){setType(t.id);S.tstage=stageNow();show('type')}
 else if(t.k==='mom')goMoment(t.id,t.wi);
 else if(t.k==='swap'){S.sg='c1';saveS();renderSit();show('sit');pointAt('m-'+t.w.id)}
 else if(t.k==='rapport')show('rapport');
 else if(t.k==='uk'){show('uk');pointAt('uk-'+t.i)}
 else if(t.k==='country'){S.country=t.i;saveS();renderDest();show('dest')}
 else if(t.k==='flight'){setDest(t.id);show('flights')}}
$('#q').addEventListener('focus',renderRes);
$('#q').addEventListener('input',()=>{SEL=0;renderRes()});
$('#q').addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'){e.preventDefault();SEL=Math.min(SR.length-1,SEL+1);renderRes()}
 else if(e.key==='ArrowUp'){e.preventDefault();SEL=Math.max(0,SEL-1);renderRes()}
 else if(e.key==='Enter'){e.preventDefault();if(e.shiftKey&&SR[SEL]&&SR[SEL].text){copyText(fill(SR[SEL].text));return}openRes(SR[SEL])}
 else if(e.key==='Escape'){$('#q').value='';closeRes();$('#q').blur()}});
$('#res').addEventListener('click',e=>{
 const rq=e.target.closest('[data-rq]');if(rq){$('#q').value=rq.dataset.rq;SEL=0;renderRes();$('#q').focus();return}
 const sp=e.target.closest('[data-sp]');if(sp){e.stopPropagation();TTS.say(fill(SR[+sp.dataset.sp].text));return}
 const c=e.target.closest('[data-cp]');if(c){e.stopPropagation();copyText(fill(SR[+c.dataset.cp].text));return}
 const b=e.target.closest('[data-i]');if(b)openRes(SR[+b.dataset.i])});
document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 const typing=e.target.matches&&e.target.matches('input,textarea,select');
 if(e.key==='Escape')return;
 if(typing)return;
 if(e.key==='/'){e.preventDefault();$('#q').focus();return}
 const k=e.key.toLowerCase();
 if(k==='n')show('notes');else if(k==='r'){e.preventDefault();openPop(true)}else if(k==='h')show('home');
 else if(k==='q')$('#qcb').click();
 else if(/^[1-9]$/.test(k)&&['home','cust','type'].includes(cur)){const t=TYPES[+k];if(t){setType(t.id);S.tstage=stageNow();if(cur==='type')renderType();else show('type')}}
 else if(k==='0'&&['home','cust','type'].includes(cur)){setType('all');S.tstage=stageNow();if(cur==='type')renderType();else show('type')}});

/* ================= INIT ================= */
renderHome();renderCust();renderSit();renderUK();renderRapport();renderFlights();renderNotes();renderDest();renderFav();renderDock();
setType(S.type);setDest(S.dest);qcDraw();setAutoUI();autoStart();
const startView=S.view&&$('#v-'+S.view)&&!['type'].includes(S.view)?S.view:'home';
show(startView);
sheetPull();setInterval(sheetPull,60000);setInterval(remTick,1000);
window.__tui={search,estH,P,memoText,S:()=>S,N:()=>N,REM:()=>REM,addRem,stageAuto,show,MOM,TYPES,QC,qcOn,tsNext,stCycle,qcVisible,goMoment};
})();

</script>
</body>
</html>
